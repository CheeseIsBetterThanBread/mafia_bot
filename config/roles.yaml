roles:
  - name: Мирный житель
    description: "Не имеет ночных способностей. Днем ищет мафию и голосует на суде"

  - name: Мафия
    description: "Ночью вместе с командой выбирает жертву для выстрела"
    is_mafia: true
    night_actions:
      - action: vote
        text: "Выберите игрока для убийства"

  - name: Дон
    description: "Глава <b>МАФИИ</b>. Его голос при стрельбе равен двум. Каждую ночь проверяет одного игрока, ища Шерифа"
    is_mafia: true
    night_actions:
      - action: vote

      - action: don_check
        text: "Выберите игрока для проверки на шерифа"

  - name: Адвокат
    description: "Играет за команду <b>МАФИИ</b>. Ночью дает одному игроку алиби (спасает от дневной казни на следующий день). Не может дать алиби одному и тому же жителю две ночи подряд"
    is_mafia: true
    night_actions:
        - action: vote

        - action: alibi
          text: "Выберите игрока, который получит алиби"

  - name: Ниндзя
    description: "Играет за команду <b>МАФИИ</b>. Каждую ночь кидает по одному сюрикену. Для убийства цели нужно два сюрикена. (Лечение сбрасывает сюрикены)"
    is_mafia: true
    night_actions:
        - action: vote

        - action: shuriken
          text: "Выберите игрока, в которого кинуть сюрикен"

  - name: Вор
    description: "Играет за команду <b>МИРНЫХ</b>. Просыпается первым. Заклеивает рот: цель лишается дневной речи и ночного хода. Если заклеит мафию — отменяет выстрел всей команды. Не может заклеить одного и того же жителя две ночи подряд"
    night_actions:
        - action: rob
          text: "Выберите игрока для склейки"

  - name: Доктор
    description: "Играет за команду <b>МИРНЫХ</b>.Ночью спасает одного игрока от убийства. Нельзя лечить одного и того же два раза подряд"
    night_actions:
      - action: heal
        text: "Выберите игрока для лечения"

  - name: Тула
    description: "Играет за команду <b>МИРНЫХ</b>. Ночью лечит игрока и дает ему алиби на день. Если Тулу убьют, ее клиент умирает вместе с ней (кроме Бессмертного). Не может ходить к одному и тому же жителю два ночи подряд"
    night_actions:
      - action: tula
        text: "Выберите игрока, к которому пойдете (хил + алиби)"

  - name: Шериф
    description: "Играет за команду <b>МИРНЫХ</b>. Ночью проверяет игрока, узнавая мафия он или нет (Маньяк видится мирным всегда, двуликий начинает видеться как мафия со следующей ночи от той, когда он нашел мафию)"
    night_actions:
      - action: sheriff_check
        text: "Выберите игрока для проверки на мафию"

  - name: Маньяк без бинтов
    description: "Играет <b>САМ ЗА СЕБЯ</b>. Каждую ночь убивает одного игрока. Побеждает, оставшись 1 на 1"
    night_actions:
      - action: maniac_kill
        text: "Выберите игрока для убийства"

  - name: Маньяк с бинтами
    description: "Играет <b>САМ ЗА СЕБЯ</b>. Каждую ночь выбирает: убить игрока ИЛИ вылечить самого себя (нельзя лечить себя 2 ночи подряд)"
    night_actions:
      - action: maniac_kill

      - action: maniac_heal
        text: "Лечить себя"

  - name: Двуликий
    description: "Начинает игру за  команду мирных. Ночью ищет мафию (проверка). Как только найдет — узнает их состав и со следующей ночи убивает сам. Для победы <b>ОБЯЗАН ПРИСОЕДИНИТСЯ К КОМАНДЕ МАФИИ</b>"
    night_actions:
      - action: two_face_check
        text: "Выберите игрока для проверки на мафию"

      - action: two_face_kill
        text: "Выберите игрока для убийства"

  - name: Бессмертный
    description: "Играет за команду <b>МИРНЫХ</b>.Неуязвим ночью: не умирает от выстрелов и сюрикенов. Может уйти только на дневном голосовании"
